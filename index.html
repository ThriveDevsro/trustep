<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prihlásenie — FeelsOdd</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-white: #FFFFFF;
      --card-border: #E2E8F0;
      --brand-navy: #0B192C;
      --brand-orange: #F05A28;
      --orange-glow: rgba(240, 90, 40, 0.15);
      --text-main: #0F172A;
      --text-muted: #64748B;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: var(--bg-white); 
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      padding: 24px;
    }

    h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; }

    /* Top Navigation (Back link) */
    .top-nav { position: absolute; top: 32px; left: 32px; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 14px; transition: color 0.2s; padding: 8px 16px; border-radius: 100px; border: 1px solid var(--card-border); }
    .back-link:hover { color: var(--brand-navy); border-color: #CBD5E1; }
    .back-link svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    /* Clean Form Wrapper (No Box) */
    .login-wrapper {
      width: 100%;
      max-width: 400px;
    }

    .header-text { text-align: center; margin-bottom: 40px; }
    .header-text h1 { font-size: 32px; color: var(--brand-navy); margin-bottom: 8px; letter-spacing: -0.5px; }
    .header-text p { color: var(--text-muted); font-size: 15px; }

    /* Form Elements */
    .form-group { margin-bottom: 20px; position: relative; }
    .form-group-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--brand-navy); text-transform: uppercase; letter-spacing: 0.5px; }
    .forgot-link { font-size: 13px; font-weight: 600; color: var(--brand-orange); text-decoration: none; transition: color 0.2s; }
    .forgot-link:hover { color: #D94F21; }

    input[type="email"], input[type="password"], input[type="text"] { 
      width: 100%; 
      padding: 14px 16px; 
      border: 1px solid var(--card-border); 
      border-radius: var(--radius-md); 
      font-family: 'Inter', sans-serif; 
      font-size: 15px; 
      color: var(--text-main); 
      background: var(--bg-white); 
      transition: all 0.2s ease; 
      outline: none; 
    }
    input:focus { border-color: var(--brand-orange); box-shadow: 0 0 0 4px var(--orange-glow); }
    input::placeholder { color: #94A3B8; }

    .btn-submit { width: 100%; background: var(--brand-navy); color: var(--bg-white); border: none; padding: 14px; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
    .btn-submit:hover { background: #162842; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(11,25,44,0.15); }

    /* Divider */
    .divider { display: flex; align-items: center; text-align: center; margin: 24px 0; color: var(--text-muted); font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--card-border); }
    .divider:not(:empty)::before { margin-right: 16px; }
    .divider:not(:empty)::after { margin-left: 16px; }

    /* Social Logins */
    .social-btns { display: flex; flex-direction: column; gap: 12px; }
    .btn-social { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 12px; background: var(--bg-white); border: 1px solid var(--card-border); border-radius: var(--radius-md); font-size: 14px; font-weight: 600; color: var(--text-main); cursor: pointer; transition: all 0.2s; text-decoration: none; }
    .btn-social:hover { background: #F8FAFC; border-color: #CBD5E1; }
    .btn-social svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* Footer Text */
    .auth-footer { text-align: center; margin-top: 32px; font-size: 14px; color: var(--text-muted); }
    .auth-footer a { color: var(--brand-orange); font-weight: 600; text-decoration: none; transition: color 0.2s; }
    .auth-footer a:hover { color: #D94F21; text-decoration: underline; }

    /* Responsive */
    @media (max-width: 480px) {
      .top-nav { position: static; width: 100%; padding: 0 0 32px 0; align-self: flex-start; }
      .back-link { border: none; padding: 0; }
    }
  </style>
</head>
<body>

  <!-- Návrat na hlavnú stránku -->
  <div class="top-nav">
    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
      Späť na web
    </a>
  </div>

  <div class="login-wrapper">
    <div class="header-text">
      <h1>Vitajte späť</h1>
      <p>Prihláste sa do svojho profilu</p>
    </div>

    <form action="#" onsubmit="event.preventDefault();">
      
      <div class="form-group">
        <div class="form-group-header">
          <label for="email">E-mailová adresa</label>
        </div>
        <input type="email" id="email" placeholder="name@email.com" required>
      </div>

      <div class="form-group">
        <div class="form-group-header">
          <label for="password">Heslo</label>
          <a href="#" class="forgot-link">Zabudli ste heslo?</a>
        </div>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Prihlásiť sa</button>
    </form>

    <div class="divider">alebo</div>

    <div class="social-btns">
      <button class="btn-social">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Pokračovať cez Google
      </button>

      <button class="btn-social">
        <svg viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 0H0v10h10V0z" fill="#F25022"/>
          <path d="M21 0H11v10h10V0z" fill="#7FBA00"/>
          <path d="M10 11H0v10h10V-10z" fill="#00A4EF"/>
          <path d="M21 11H11v10h10V-10z" fill="#FFB900"/>
        </svg>
        Pokračovať cez Microsoft
      </button>
    </div>

    <div class="auth-footer">
      Nemáte ešte účet? <a href="registracia.html">Vytvoriť účet</a>
    </div>

  </div>

</body>
</html>
